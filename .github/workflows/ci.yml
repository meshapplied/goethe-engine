name: ci
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"        # nightly, on the default branch (main)
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # a new push to a PR replaces its run; branch pushes always finish
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.19"
          enable-cache: false
      - run: uvx ruff@0.17.5 check .
      - run: .github/leak-guard.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      OMP_NUM_THREADS: "1"      # one torch thread per xdist worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --python ${{ matrix.python }} --extra test --extra serve --extra worker
      - run: uv run --no-sync pytest -x -q --timeout=60 -n auto

  import-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.19"
          enable-cache: false
      - run: .github/import-clean.sh
