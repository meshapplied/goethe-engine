[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goethe-engine"
version = "0.3.8"
description = "Token-level LLM serving core: scheduling, KV blocks, prefix cache, sampling, speculative rounds"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
ref = ["torch"]            # the CPU / torch reference backends and host drafters; gc-c packs run on numpy buffers
serve = ["transformers"]
worker = ["protobuf>=4"]       # worker protocol v1 (spec/proto/worker.proto)
grammar = ["xgrammar"]
test = ["pytest", "pytest-timeout", "pytest-xdist", "jsonschema", "torch"]

[project.scripts]
goethe-engine = "goethe_engine.cli:main"

[tool.setuptools]
packages = ["goethe_engine"]

[tool.setuptools.package-data]
goethe_engine = ["spec/*.json", "spec/params/*.json", "spec/proto/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU box and a real pack"]

[tool.ruff.lint]
select = ["E9", "F"]   # syntax errors and pyflakes: real bugs only

[tool.ruff.lint.per-file-ignores]
"tests/conformance/test_conformance.py" = ["F811"]   # fixtures imported by name, then requested by argument

[tool.uv]
environments = ["sys_platform == 'linux'"]   # the lock is for the Linux CI and dev hosts; torch comes from its CPU index

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
